name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip room-android-v2.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

          - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
