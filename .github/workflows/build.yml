name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip room-native-10.zip -d source

      - name: Fix duplicate variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/room-android-v2/app/src/main/java/jp/roomhelper/NativePostService.java")
          text = p.read_text()
          text = text.replace("int editors=0", "int visibleEditorCount=0")
          text = text.replace("editors++", "visibleEditorCount++")
          text = text.replace("+editors+", "+visibleEditorCount+")
          p.write_text(text)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build
        working-directory: source/room-android-v2
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: room-apk
          path: source/room-android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
